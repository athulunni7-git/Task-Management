{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Edit Task</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="container">

    <h1>Edit Task</h1>

    <form id="editTaskForm">

        <input
            type="text"
            id="title"
            placeholder="Task title"
            required
        >

        <textarea
            id="description"
            placeholder="Description"
        ></textarea>

        <select id="status">

            <option value="todo">
                Todo
            </option>

            <option value="in_progress">
                In Progress
            </option>

            <option value="completed">
                Completed
            </option>

        </select>

        <select id="priority">

            <option value="low">
                Low
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="high">
                High
            </option>

        </select>

        <input
            type="date"
            id="due_date"
        >

        <button type="submit">
            Update Task
        </button>

    </form>

    <p id="message"></p>

    <button onclick="window.location.href='/dashboard/'">
        Back to Tasks
    </button>

</div>

<script src="{% static 'js/edit_task.js' %}"></script>

</body>

</html>
